# Build de EvalIA fuera de EasyPanel: ninguna credencial de runtime
# se pasa como Docker build-arg ni aparece en logs de build del VPS.
name: Publish evalia-web image

on:
  push:
    branches:
      - infra/easypanel-migration
      - feature/evalia-talent-foundation
      - feature/evalia-talent-cv-ranking
      - feature/evalia-stitch-ui
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "AGENTS.md"
      - "CLAUDE.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ralborta/evalia

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (web)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/infra/easypanel-migration' }}
            type=raw,value=talent-foundation,enable=${{ github.ref == 'refs/heads/feature/evalia-talent-foundation' }}
            type=raw,value=talent-foundation-${{ github.sha }},enable=${{ github.ref == 'refs/heads/feature/evalia-talent-foundation' }}
            type=raw,value=talent-cv,enable=${{ github.ref == 'refs/heads/feature/evalia-talent-cv-ranking' }}
            type=raw,value=talent-cv-${{ github.sha }},enable=${{ github.ref == 'refs/heads/feature/evalia-talent-cv-ranking' }}
            type=raw,value=talent-stitch,enable=${{ github.ref == 'refs/heads/feature/evalia-stitch-ui' }}
            type=raw,value=talent-stitch-${{ github.sha }},enable=${{ github.ref == 'refs/heads/feature/evalia-stitch-ui' }}
            type=raw,value=${{ github.sha }}

      - name: Build and push web (runner)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=
          provenance: false
          sbom: false

      - name: Image metadata (worker)
        id: meta-worker
        if: github.ref == 'refs/heads/feature/evalia-talent-cv-ranking'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=talent-cv-worker
            type=raw,value=talent-cv-worker-${{ github.sha }}

      - name: Build and push worker
        if: github.ref == 'refs/heads/feature/evalia-talent-cv-ranking'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_APP_URL=
          provenance: false
          sbom: false

      - name: Make GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH \
            "/user/packages/container/evalia/versions" \
            >/dev/null 2>&1 || true
          gh api -X PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/evalia" \
            -f visibility=public || true

      - name: Trigger EasyPanel pull
        continue-on-error: true
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [ -z "${EASYPANEL_DEPLOY_URL}" ]; then
            echo "EASYPANEL_DEPLOY_URL no configurado; omitiendo pull"
            exit 0
          fi
          curl -fsS -X POST "$EASYPANEL_DEPLOY_URL"
          echo "EasyPanel deploy triggered"
